/* ========== EAT & SHOP VIEW (merged Food + Shopping, by city) ========== */
let guideFilterCity = null; // null = all, else a city name. Shares foodExpanded for collapse state.

function renderGuide() {
  const body = document.getElementById("guideBody");
  const cities = ["Montréal", "Québec City"];
  const filterPills = [["all", "All", null], ...cities.map(c => [c, c, c])]
    .map(([k, label, city]) => {
      const active = (city === guideFilterCity) || (k === "all" && !guideFilterCity);
      return `<button class="guideFilterPill pill ${active ? "bg-slate-900 text-white dark:bg-yellow-400 dark:text-slate-900" : "bg-white border border-slate-300 dark:bg-slate-800 dark:border-slate-700"}" data-city="${city || ""}">${label}</button>`;
    }).join("");

  const visibleCities = guideFilterCity ? [guideFilterCity] : cities;
  const cityBlocks = visibleCities.map(city => {
    // --- EAT: iconic dishes ---
    const foods = FOODS_BY_CITY[city] || [];
    const foodCards = foods.map(f => {
      const dayBtn = f.day
        ? `<button class="guideDayJump pill bg-white border border-slate-300 dark:bg-slate-800 dark:border-slate-700 text-xs" data-day="${f.day}">→ Day ${f.day}</button>`
        : "";
      return `
        <div class="rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-3">
          <div class="font-semibold text-[15px]">${f.emoji} ${escapeHtml(f.name)}</div>
          <div class="text-sm opacity-80 mt-1">${escapeHtml(f.blurb)}</div>
          <div class="text-xs opacity-70 mt-2"><span class="opacity-60">Where: </span>${escapeHtml(f.where)}</div>
          ${dayBtn ? `<div class="mt-2 flex flex-wrap gap-2">${dayBtn}</div>` : ""}
        </div>`;
    }).join("");

    // --- EAT: Michelin (check to add to itinerary) ---
    const michelin = MICHELIN_BY_CITY[city] || [];
    const michelinCards = michelin.map(r => {
      const added = isExtraDestination(r.day, r.id);
      const starBar = "⭐".repeat(r.stars);
      const linkBtn = r.url
        ? `<a href="${r.url}" target="_blank" rel="noopener" class="pill bg-white border border-slate-300 dark:bg-slate-800 dark:border-slate-700 text-xs">↗ Site</a>`
        : "";
      const dayBtn = `<button class="guideDayJump pill bg-white border border-slate-300 dark:bg-slate-800 dark:border-slate-700 text-xs" data-day="${r.day}">→ Day ${r.day}</button>`;
      const tripDay = TRIP.find(t => t.day === r.day);
      const bookBy = bookByLabel(tripDay?.date, r.bookWeeks);
      const today = new Date(todayIso());
      const bookByDate = tripDay && r.bookWeeks
        ? new Date(new Date(tripDay.date + "T00:00:00").getTime() - r.bookWeeks * 7 * 86400000)
        : null;
      const overdue = bookByDate && bookByDate < today;
      const bookBadgeCls = overdue
        ? "bg-rose-100 text-rose-900 dark:bg-rose-900/40 dark:text-rose-200"
        : "bg-emerald-100 text-emerald-900 dark:bg-emerald-900/40 dark:text-emerald-200";
      const bookBadge = r.bookWeeks
        ? `<span class="pill text-xs ${bookBadgeCls}">📅 Book ~${r.bookWeeks} wks ahead${bookBy ? ` · by ${bookBy}` : ""}${overdue ? " (overdue!)" : ""}</span>`
        : "";
      return `
        <label class="rounded-xl bg-white dark:bg-slate-900 border ${added ? "border-amber-400 dark:border-amber-500" : "border-slate-200 dark:border-slate-800"} p-3 flex items-start gap-3 cursor-pointer">
          <input type="checkbox" class="guideMichelinToggle mt-1 h-5 w-5 accent-amber-500 flex-shrink-0" data-id="${r.id}" data-city="${city}" ${added ? "checked" : ""}>
          <div class="flex-1 min-w-0">
            <div class="flex items-baseline justify-between gap-2">
              <div class="font-semibold text-[15px]">${escapeHtml(r.name)}</div>
              <div class="text-xs whitespace-nowrap">${starBar}</div>
            </div>
            <div class="text-sm opacity-80 mt-1">${escapeHtml(r.note)}</div>
            ${r.soloNote ? `<div class="text-xs opacity-75 mt-2"><span class="opacity-60">Solo: </span>${escapeHtml(r.soloNote)}</div>` : ""}
            <div class="mt-2 flex flex-wrap gap-2">${bookBadge}${linkBtn}${dayBtn}${added ? `<span class="pill text-xs bg-amber-100 text-amber-900 dark:bg-amber-900/40 dark:text-amber-200">Added to Day ${r.day}</span>` : ""}</div>
          </div>
        </label>`;
    }).join("");
    const michelinBlock = michelin.length ? `
      <div class="space-y-2 mt-2">
        <div class="text-xs uppercase tracking-wider opacity-60 px-1">🍽 Worth-it family eats · check to add to itinerary · kid notes + lead-time included</div>
        ${michelinCards}
      </div>` : "";

    // --- SHOP: stores grouped by category ---
    const shops = SHOPS_BY_CITY[city] || [];
    const byCat = {};
    for (const s of shops) (byCat[s.cat] ||= []).push(s);
    const shopCatBlocks = SHOP_CAT_ORDER.filter(c => byCat[c]).map(cat => {
      const cards = byCat[cat].map(s => {
        const visitBtn = s.url
          ? `<a href="${s.url}" target="_blank" rel="noopener" class="pill bg-white border border-slate-300 dark:bg-slate-800 dark:border-slate-700 text-xs">↗ Visit</a>`
          : "";
        const dayBtn = `<button class="guideDayJump pill bg-white border border-slate-300 dark:bg-slate-800 dark:border-slate-700 text-xs" data-day="${s.day}">→ Day ${s.day}</button>`;
        return `
          <div class="rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-3">
            <div class="flex items-baseline justify-between gap-2">
              <div class="font-semibold text-[15px]">${escapeHtml(s.name)}</div>
              <div class="text-xs opacity-60 whitespace-nowrap">${escapeHtml(s.neighborhood)}</div>
            </div>
            <div class="text-sm opacity-80 mt-1">${escapeHtml(s.note)}</div>
            <div class="mt-2 flex flex-wrap gap-2">${visitBtn}${dayBtn}</div>
          </div>`;
      }).join("");
      return `
        <div class="space-y-2">
          <div class="text-xs uppercase tracking-wider opacity-60 px-1">${SHOP_CAT_LABEL[cat]}</div>
          ${cards}
        </div>`;
    }).join("");

    const eatSection = (foodCards || michelinBlock)
      ? `<div class="text-sm font-semibold opacity-80 px-1 pt-1">🍴 Eat</div>${foodCards}${michelinBlock}`
      : "";
    const shopSection = shopCatBlocks
      ? `<div class="text-sm font-semibold opacity-80 px-1 pt-3">🛍 Shop</div>${shopCatBlocks}`
      : "";
    if (!eatSection && !shopSection) return "";

    const open = foodExpanded.has(city);
    const addedCount = michelin.filter(r => isExtraDestination(r.day, r.id)).length;
    return `
      <div class="space-y-2">
        <button class="guideCityToggle w-full flex items-center justify-between pt-2 text-left" data-city="${city}" aria-expanded="${open}">
          <span class="serif text-xl">${city}</span>
          <span class="flex items-center gap-2 text-sm opacity-70">
            ${addedCount ? `<span class="pill text-xs bg-amber-100 text-amber-900 dark:bg-amber-900/40 dark:text-amber-200">⭐ ${addedCount} added</span>` : ""}
            <span class="text-xs">${foods.length} eat · ${shops.length} shop</span>
            <span class="text-lg transition-transform ${open ? "rotate-90" : ""}">▸</span>
          </span>
        </button>
        <div class="guideCityBody space-y-2 ${open ? "" : "hidden"}" data-city-body="${city}">
          ${eatSection}
          ${shopSection}
        </div>
      </div>`;
  }).join("");

  body.innerHTML = `
    <div class="space-y-4">
      <div class="rounded-2xl bg-white dark:bg-slate-900 p-4 border border-slate-200 dark:border-slate-800">
        <div class="serif text-lg mb-1">🍴 🛍 Eat &amp; Shop by city</div>
        <div class="text-sm opacity-70">Iconic dishes, worth-it family eats, and the curated toy/book/treat map — combined per city. Tap a city to open, "→ Day N" to drop into the planner.</div>
      </div>
      ${VAT_REFUND_HTML}
      <div class="flex flex-wrap gap-2 px-1">${filterPills}</div>
      ${cityBlocks}
    </div>`;

  body.querySelectorAll(".guideFilterPill").forEach(b => {
    b.addEventListener("click", () => { guideFilterCity = b.dataset.city || null; renderGuide(); });
  });
  body.querySelectorAll(".guideCityToggle").forEach(b => {
    b.addEventListener("click", () => {
      const city = b.dataset.city;
      if (foodExpanded.has(city)) foodExpanded.delete(city); else foodExpanded.add(city);
      renderGuide();
    });
  });
  body.querySelectorAll(".guideDayJump").forEach(b => {
    b.addEventListener("click", e => {
      e.preventDefault();
      e.stopPropagation();
      const dayNum = parseInt(b.dataset.day, 10);
      setView("days");
      setTimeout(() => {
        const el = document.querySelector(`[data-day-card="${dayNum}"]`);
        if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
      }, 50);
    });
  });
  body.querySelectorAll(".guideMichelinToggle").forEach(cb => {
    cb.addEventListener("change", () => {
      const id = cb.dataset.id;
      const city = cb.dataset.city;
      const r = (MICHELIN_BY_CITY[city] || []).find(x => x.id === id);
      if (!r) return;
      if (cb.checked) addExtraDestination(r.day, { id: r.id, name: `⭐ ${r.name}`, url: r.url, note: r.note, source: "michelin" });
      else removeExtraDestination(r.day, r.id);
      save();
      renderGuide();
    });
  });
}

/* ========== TIPS VIEW (archived — not in bottom bar) ========== */
let tipsFilterCity = null; // null = all, else "Montréal" / "Québec City"
// Session-only set: tip IDs added this page-load. Used to render a ✨ NEW badge
// so the user can see what the Claude pill just produced. Clears on reload.
const freshTipIds = new Set();

function renderTips() {
  const body = document.getElementById("tipsBody");
  const cities = ["Montréal", "Québec City"];
  const refreshButtons = cities.map(c => `<button class="ideaRefresh pill bg-white border border-slate-300 dark:bg-slate-800 dark:border-slate-700" data-city="${c}">🔁 ${c}</button>`).join("");
  const filterPills = [["all", "All", null], ...cities.map(c => [c, c, c])]
    .map(([k, label, city]) => {
      const active = (city === tipsFilterCity) || (k === "all" && !tipsFilterCity);
      return `<button class="tipsFilterPill pill ${active ? "bg-slate-900 text-white dark:bg-yellow-400 dark:text-slate-900" : "bg-white border border-slate-300 dark:bg-slate-800 dark:border-slate-700"}" data-city="${city || ""}">${label}</button>`;
    }).join("");
  // Sorted: pinned (starred) first, then newest first.
  const visible = state.tips.filter(t => !t.dismissed)
    .filter(t => !tipsFilterCity || (TRIP.find(d => d.day === t.day)?.city === tipsFilterCity));
  const sorted = [...visible].sort((a, b) => {
    if (!!a.starred !== !!b.starred) return a.starred ? -1 : 1;
    return (b.timestamp || "").localeCompare(a.timestamp || "");
  });
  body.innerHTML = `
    <div class="space-y-3">
      <div class="rounded-2xl bg-white dark:bg-slate-900 p-4 border border-slate-200 dark:border-slate-800">
        <div class="serif text-lg mb-1">💡 Tips from Claude</div>
        <div class="text-sm opacity-70 mb-3">Tap a city to generate fresh tips (max 5× per city per day).</div>
        <div class="flex flex-wrap gap-2">${refreshButtons}</div>
        <div id="ideaStatus" class="text-sm mt-3"></div>
      </div>
      <div class="flex flex-wrap gap-2 px-1">${filterPills}</div>
      ${sorted.length
        ? `<div class="space-y-2">${sorted.map(t => tipCardHtml(t)).join("")}</div>`
        : `<div class="rounded-2xl border-2 border-dashed border-slate-300 dark:border-slate-700 p-8 text-center text-sm opacity-70">No tips yet. Tap a city above to generate some.</div>`}
    </div>
  `;
  // Wire handlers.
  body.querySelectorAll(".ideaRefresh").forEach(b => {
    b.addEventListener("click", () => refreshTipsForCity(b.dataset.city));
  });
  body.querySelectorAll(".tipsFilterPill").forEach(b => {
    b.addEventListener("click", () => {
      tipsFilterCity = b.dataset.city || null;
      renderTips();
    });
  });
  body.querySelectorAll(".tipStar").forEach(b => {
    b.addEventListener("click", () => {
      const t = state.tips.find(x => x.id === b.dataset.id);
      if (!t) return;
      t.starred = !t.starred;
      save();
      renderTips();
    });
  });
  body.querySelectorAll(".tipDismiss").forEach(b => {
    b.addEventListener("click", () => {
      const t = state.tips.find(x => x.id === b.dataset.id);
      if (!t) return;
      t.dismissed = true;
      save();
      renderTips();
    });
  });
}

function tipCardHtml(t, opts = {}) {
  const day = TRIP.find(d => d.day === t.day);
  return `
    <div class="rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-3 tip-${t.bucket}">
      <div class="flex items-start justify-between gap-2">
        <div class="flex-1">
          <div class="text-xs font-semibold opacity-70">${bucketLabel(t.bucket)}${day ? ` · Day ${day.day} ${day.city}` : ""}${t.neighborhood ? ` · ${t.neighborhood}` : ""}</div>
          <div class="serif text-lg mt-0.5">${t.title}</div>
          <div class="text-sm mt-1">${t.body}</div>
          ${t.address ? `<div class="text-xs opacity-60 mt-1">📍 ${t.address}</div>` : ""}
          ${t.url ? `<a href="${t.url}" target="_blank" rel="noopener noreferrer" class="text-xs underline opacity-70">link ↗</a>` : ""}
        </div>
        ${!opts.compact ? `
          <div class="flex flex-col gap-1">
            <button class="tipStar tap text-lg" data-id="${t.id}" aria-label="Star">${t.starred ? "⭐" : "☆"}</button>
            <button class="tipDismiss tap text-lg" data-id="${t.id}" aria-label="Dismiss">✕</button>
          </div>
        ` : ""}
      </div>
    </div>
  `;
}

function uploadCardHtml(u, opts = {}) {
  const e = u.extracted || {};
  const day = TRIP.find(d => d.day === u.day);
  const kind = (e.kind || "note").toLowerCase();
  const kindIcon = { flight: "✈️", train: "🚄", hotel: "🏨", restaurant: "🍽", activity: "🎟", note: "📝" }[kind] || "📎";
  // For the prominent travel-day hero card, swap colors so it stays legible on dark/highlight background.
  const base = opts.highlight
    ? "rounded-xl bg-white/10 border border-white/20 p-3"
    : "rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-3";
  const addrCopy = e.address
    ? `<button class="addrCopy text-xs underline opacity-70 hover:opacity-100" data-text="${escapeAttr(e.address)}" aria-label="Copy address">📋 copy</button>`
    : "";
  // Per-kind quick-glance line: hotels show address+check-in, trains show route+confirmation, flights show flight+gate-style info.
  let timeLine = "";
  if (e.date) {
    timeLine = `📅 ${e.date}${e.time ? " " + e.time : ""}${e.endDate ? ` → ${e.endDate}${e.endTime ? " " + e.endTime : ""}` : ""}`;
  }
  return `
    <div class="${base}">
      <div class="flex items-start justify-between gap-2">
        <div class="flex-1 min-w-0">
          <div class="text-xs font-semibold opacity-70">${kindIcon} ${kind.toUpperCase()}${day ? ` · Day ${day.day} ${day.city}` : ""}</div>
          <div class="serif text-lg mt-0.5 break-words">${e.title || "Untitled"}</div>
          ${timeLine ? `<div class="text-sm mt-1">${timeLine}</div>` : ""}
          ${e.vendor ? `<div class="text-sm">🏷 ${e.vendor}</div>` : ""}
          ${e.confirmation ? `<div class="text-sm font-mono">🔐 ${e.confirmation}</div>` : ""}
          ${e.address ? `<div class="text-sm opacity-90 mt-1 flex items-center gap-2 flex-wrap">📍 <span class="break-words">${e.address}</span> ${addrCopy}</div>` : ""}
          ${e.notes ? `<div class="text-xs opacity-60 mt-1">${e.notes}</div>` : ""}
        </div>
        ${opts.full ? `<button class="uploadDel tap text-lg" data-id="${u.id}" aria-label="Delete">🗑</button>` : ""}
      </div>
    </div>
  `;
}

function escapeAttr(s) { return String(s).replace(/"/g, "&quot;"); }

async function refreshTipsForCity(city) {
  if (!requireOnline()) {
    const el = document.getElementById("ideaStatus");
    if (el) el.textContent = "You're offline. Connect, then try again.";
    return;
  }
  const key = todayIso() + ":" + city;
  state.refreshCounts[key] = (state.refreshCounts[key] || 0) + 1;
  if (state.refreshCounts[key] > 5) {
    document.getElementById("ideaStatus").textContent = `Refresh limit reached for ${city} today (5/day).`;
    save();
    return;
  }
  save();
  document.getElementById("ideaStatus").textContent = `Generating ${city} tips…`;
  const day = TRIP.find(d => d.city === city);
  try {
    const r = await fetch("/api/tips", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        city,
        date: day ? day.date : null,
        interests: state.interestProfile,
      })
    });
    const j = await r.json();
    if (!j.ok || !j.tips) {
      document.getElementById("ideaStatus").textContent = `Error: ${j.error || "unknown"}`;
      return;
    }
    for (const t of j.tips) {
      state.tips.push({
        id: uid(),
        day: day ? day.day : null,
        bucket: t.bucket,
        title: t.title,
        body: t.body,
        address: t.address || null,
        neighborhood: t.neighborhood || null,
        url: t.url || null,
        starred: false,
        dismissed: false,
        timestamp: new Date().toISOString(),
      });
    }
    save();
    renderTips();
  } catch (e) {
    const s = document.getElementById("ideaStatus");
    if (s) s.textContent = "Network error: " + e.message;
  }
}

async function fetchTipsForDay(day, mountId) {
  const mount = document.getElementById(mountId);
  if (!mount) return;
  if (!requireOnline()) {
    mount.innerHTML = `<div class="rounded-xl p-3 bg-rose-100 dark:bg-rose-900/40 text-sm">You're offline — can't generate fresh tips. Existing tips are still in the Tips tab.</div>`;
    return;
  }
  mount.innerHTML = `<div class="rounded-xl bg-slate-100 dark:bg-slate-800 p-3 text-sm">Generating ${day.city} tips…</div>`;
  try {
    const r = await fetch("/api/tips", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        city: day.city,
        date: day.date,
        interests: state.interestProfile,
        context: `Already planned — AM: ${day.am}\nPM: ${day.pm}`,
      })
    });
    const j = await r.json();
    if (!j.ok || !j.tips) {
      mount.innerHTML = `<div class="rounded-xl p-3 bg-rose-100 dark:bg-rose-900/40 text-sm">Error: ${j.error || "unknown"}</div>`;
      return;
    }
    const newTips = j.tips.map(t => ({
      id: uid(), day: day.day, bucket: t.bucket, title: t.title, body: t.body,
      address: t.address || null, neighborhood: t.neighborhood || null, url: t.url || null,
      starred: false, dismissed: false, timestamp: new Date().toISOString(),
    }));
    state.tips.push(...newTips);
    save();
    mount.innerHTML = `<div class="space-y-2">${newTips.map(t => tipCardHtml(t)).join("")}</div>`;
    mount.querySelectorAll(".tipStar").forEach(b => {
      b.addEventListener("click", () => {
        const t = state.tips.find(x => x.id === b.dataset.id);
        if (!t) return;
        t.starred = !t.starred;
        save();
        b.textContent = t.starred ? "⭐" : "☆";
      });
    });
    mount.querySelectorAll(".tipDismiss").forEach(b => {
      b.addEventListener("click", () => {
        const t = state.tips.find(x => x.id === b.dataset.id);
        if (!t) return;
        t.dismissed = true;
        save();
        b.closest(".rounded-xl").remove();
      });
    });
  } catch (e) {
    mount.innerHTML = `<div class="rounded-xl p-3 bg-rose-100 dark:bg-rose-900/40 text-sm">Network error: ${e.message}</div>`;
  }
}

/* ========== NOTES VIEW ========== */
let notesSub = "checklists";
document.querySelectorAll(".notes-sub").forEach(b => {
  b.addEventListener("click", () => { notesSub = b.dataset.sub; renderNotes(); });
});

function renderNotes() {
  document.querySelectorAll(".notes-sub").forEach(b => {
    const active = b.dataset.sub === notesSub;
    b.classList.toggle("bg-slate-900", active);
    b.classList.toggle("text-white", active);
    b.classList.toggle("dark:bg-yellow-400", active);
    b.classList.toggle("dark:text-slate-900", active);
    b.classList.toggle("bg-white", !active);
    b.classList.toggle("border", !active);
    b.classList.toggle("border-slate-300", !active);
    b.classList.toggle("dark:bg-slate-800", !active);
    b.classList.toggle("dark:border-slate-700", !active);
  });
  const body = document.getElementById("notesBody");
  if (notesSub === "journal") body.innerHTML = journalHtml();
  if (notesSub === "byday") body.innerHTML = byDayNotesHtml();
  if (notesSub === "checklists") body.innerHTML = checklistsHtml();
  if (notesSub === "expenses") body.innerHTML = expensesHtml();
  wireNotesHandlers();
}

// Effective render order: persisted state.checklistsOrder, with any new/unknown keys appended.
function effectiveChecklistOrder() {
  const known = state.checklists ? Object.keys(state.checklists) : [];
  const ordered = (state.checklistsOrder || []).filter(k => known.includes(k));
  const extras = known.filter(k => !ordered.includes(k));
  return [...ordered, ...extras];
}

function checklistsHtml() {
  const order = effectiveChecklistOrder();
  const cards = order.map(k => {
    const list = state.checklists[k];
    if (!list) return "";
    const done = list.items.filter(i => i.checked).length;
    const total = list.items.length;
    const pct = total ? Math.round((done / total) * 100) : 0;
    const collapsed = state.checklistsCollapsed?.[k] !== false; // default collapsed
    return `
      <div class="listCard rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800" data-list="${k}">
        <div class="listHeader flex items-center gap-2 p-4 cursor-pointer select-none">

          <div class="flex-1 min-w-0">
            <div class="serif text-lg truncate">${list.title}</div>
            <div class="progress-bar mt-2"><div class="progress-fill" style="width:${pct}%"></div></div>
          </div>
          <div class="text-xs opacity-70 whitespace-nowrap">${done}/${total}</div>
          <span class="chev ${collapsed ? "" : "open"} text-base opacity-60">▾</span>
        </div>
        <div class="listBody px-4 pb-4 ${collapsed ? "hidden" : ""}">
          <div class="space-y-1">
            ${list.items.map((i, idx) => `
              <label class="flex items-start gap-2 cursor-pointer">
                <input type="checkbox" data-list="${k}" data-idx="${idx}" class="checkItem mt-1" ${i.checked ? "checked" : ""} />
                <span class="text-[15px] ${i.checked ? "line-through opacity-50" : ""}">${i.text}</span>
                <button class="ml-auto opacity-30 hover:opacity-100 text-xs delItem" data-list="${k}" data-idx="${idx}">✕</button>
              </label>
            `).join("")}
          </div>
          <div class="flex gap-2 mt-3">
            <input class="addItemInput flex-1 rounded border p-1 text-sm dark:bg-slate-950 dark:border-slate-700" data-list="${k}" placeholder="Add item…" />
            <button class="addItemBtn pill bg-slate-100 dark:bg-slate-800 text-sm" data-list="${k}">+</button>
          </div>
        </div>
      </div>
    `;
  }).join("");
  return `
    <div id="checklistsContainer" class="space-y-3">
      ${cards}
    </div>
    <div class="rounded-2xl bg-white dark:bg-slate-900 border-2 border-dashed border-slate-300 dark:border-slate-700 p-4 mt-3">

        <input id="newListTitle" class="flex-1 rounded border p-1 text-sm dark:bg-slate-950 dark:border-slate-700" placeholder="New checklist title…" />
        <button id="addListBtn" class="pill bg-slate-900 text-white dark:bg-yellow-400 dark:text-slate-900 text-sm">+ List</button>
      </div>
    </div>
  `;
}

function curSymbol(c) { return c === "CAD" ? "C$" : "$"; }
function fxConvert(amount, from, to, rate) {
  if (!amount) return 0;
  if (from === to) return amount;
  if (from === "USD" && to === "CAD") return amount / rate;
  if (from === "CAD" && to === "USD") return amount * rate;
  return amount;
}

function expensesHtml() {
  const rate = state.cadUsd || 0.73;
  const disp = state.displayCurrency === "CAD" ? "CAD" : "USD";
  const sym = curSymbol(disp);
  const other = disp === "USD" ? "CAD" : "USD";
  const otherSym = curSymbol(other);
  // Convert everything to display currency for aggregates.
  const totalDisp = state.expenses.reduce((s, e) => s + fxConvert(+e.amount || 0, e.currency || "USD", disp, rate), 0);
  const totalOther = fxConvert(totalDisp, disp, other, rate);
  const byCat = {};
  for (const e of state.expenses) {
    const v = fxConvert(+e.amount || 0, e.currency || "USD", disp, rate);
    byCat[e.category] = (byCat[e.category] || 0) + v;
  }
  const dayOpts = ["<option value=''>—</option>"].concat(TRIP.map(d => `<option value="${d.day}">Day ${d.day}</option>`)).join("");
  const sorted = [...state.expenses].sort((a, b) => (b.timestamp || "").localeCompare(a.timestamp || ""));
  const days = new Set(state.expenses.map(e => e.day).filter(Boolean)).size || 1;
  const avg = totalDisp / days;
  // Currency toggle buttons.
  const toggle = `
    <div class="inline-flex rounded-full bg-stone-100 dark:bg-slate-800 p-1 text-sm">
      <button class="curToggle px-3 py-1 rounded-full ${disp === "USD" ? "bg-slate-900 text-white dark:bg-yellow-400 dark:text-slate-900" : ""}" data-cur="USD">$ USD</button>
      <button class="curToggle px-3 py-1 rounded-full ${disp === "CAD" ? "bg-slate-900 text-white dark:bg-yellow-400 dark:text-slate-900" : ""}" data-cur="CAD">C$ CAD</button>
    </div>
  `;
  return `
    <div class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4">
      <div class="flex items-center justify-between gap-2 flex-wrap">
        <div class="serif text-xl">${sym}${totalDisp.toFixed(2)} <span class="text-sm opacity-60">≈ ${otherSym}${totalOther.toFixed(2)}</span></div>
        ${toggle}
      </div>
      <div class="text-xs opacity-60 mt-1">Per-day avg: ${sym}${avg.toFixed(2)} · rate ${rate.toFixed(3)} USD/CAD</div>
      <div class="flex flex-wrap gap-2 mt-3">
        ${Object.entries(byCat).map(([c, v]) => `<span class="pill bg-stone-100 dark:bg-slate-800">${c}: ${sym}${v.toFixed(0)}</span>`).join("")}
      </div>
    </div>
    <div class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 mt-3">
      <div class="text-xs opacity-60 mb-2">New expenses are stored in <b>${sym} ${disp}</b>. Toggle above to switch.</div>
      <div class="grid grid-cols-2 gap-2 text-sm">
        <label>Amount ${sym} <input id="exAmt" type="number" step="0.01" class="w-full rounded border p-1 mt-1 dark:bg-slate-950 dark:border-slate-700" /></label>
        <label>Day <select id="exDay" class="w-full rounded border p-1 mt-1 dark:bg-slate-950 dark:border-slate-700">${dayOpts}</select></label>
        <label>Category <select id="exCat" class="w-full rounded border p-1 mt-1 dark:bg-slate-950 dark:border-slate-700">
          ${["food","hotel","train","transit","tickets","shopping","drinks","other"].map(c => `<option>${c}</option>`).join("")}
        </select></label>
        <label>Note <input id="exNote" class="w-full rounded border p-1 mt-1 dark:bg-slate-950 dark:border-slate-700" /></label>
      </div>
      <div class="mt-3 flex gap-2">
        <button id="exAdd" class="pill bg-slate-900 text-white dark:bg-yellow-400 dark:text-slate-900">Add</button>
        <button id="exExport" class="pill bg-white border border-slate-300 dark:bg-slate-800 dark:border-slate-700">📋 Export</button>
      </div>
    </div>
    <div class="mt-3 space-y-1">
      ${sorted.map(e => {
        const c = e.currency || "USD";
        const cs = curSymbol(c);
        const conv = c !== disp ? ` <span class="opacity-50">≈ ${sym}${fxConvert(+e.amount || 0, c, disp, rate).toFixed(2)}</span>` : "";
        return `
        <div class="flex items-center gap-2 p-2 rounded bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-sm">
          <span class="font-mono">${cs}${(+e.amount).toFixed(2)}${conv}</span>
          <span class="pill bg-stone-100 dark:bg-slate-800 text-xs">${e.category}</span>
          ${e.day ? `<span class="text-xs opacity-60">D${e.day}</span>` : ""}
          <span class="flex-1 truncate">${e.note || ""}</span>
          <button class="exDel opacity-40" data-id="${e.id}">✕</button>
        </div>
        `;
      }).join("")}
    </div>
  `;
}

function wireNotesHandlers() {
  if (notesSub === "byday") {
    document.querySelectorAll("[data-byday-note]").forEach(ta => {
      ta.addEventListener("input", e => {
        const d = +ta.dataset.bydayNote;
        state.perDayNotes[d] = e.target.value;
        save();
      });
    });
  }
  if (notesSub === "journal") {
    document.getElementById("addNoteBtn").addEventListener("click", () => {
      const text = document.getElementById("newNoteText").value.trim();
      if (!text) return;
      const day = document.getElementById("newNoteDay").value;
      state.notes.push({ id: uid(), text, day: day ? +day : null, timestamp: new Date().toISOString() });
      save();
      renderNotes();
    });
    document.querySelectorAll(".noteDel").forEach(b => {
      b.addEventListener("click", () => {
        if (!confirm("Delete note?")) return;
        state.notes = state.notes.filter(n => n.id !== b.dataset.id);
        save();
        renderNotes();
      });
    });
  }
  if (notesSub === "checklists") {
    document.querySelectorAll(".checkItem").forEach(c => {
      c.addEventListener("change", () => {
        const list = state.checklists[c.dataset.list];
        if (!list) return;
        list.items[+c.dataset.idx].checked = c.checked;
        save();
        renderNotes();
      });
    });
    document.querySelectorAll(".delItem").forEach(b => {
      b.addEventListener("click", e => {
        e.preventDefault();
        const list = state.checklists[b.dataset.list];
        list.items.splice(+b.dataset.idx, 1);
        save();
        renderNotes();
      });
    });
    document.querySelectorAll(".addItemBtn").forEach(b => {
      b.addEventListener("click", () => {
        const input = document.querySelector(`.addItemInput[data-list="${b.dataset.list}"]`);
        const txt = input.value.trim();
        if (!txt) return;
        state.checklists[b.dataset.list].items.push({ text: txt, checked: false });
        save();
        renderNotes();
      });
    });
    document.getElementById("addListBtn").addEventListener("click", () => {
      const title = document.getElementById("newListTitle").value.trim();
      if (!title) return;
      const key = "list_" + uid();
      // Snapshot the current order BEFORE adding the new list — otherwise
      // effectiveChecklistOrder() would already include it and we'd double-add.
      const prev = effectiveChecklistOrder();
      state.checklists[key] = { title, items: [] };
      state.checklistsOrder = [...prev, key];
      state.checklistsCollapsed = { ...(state.checklistsCollapsed || {}), [key]: true };
      save();
      renderNotes();
    });

    // Click anywhere on the header (except the drag handle) toggles collapsed.
    document.querySelectorAll(".listHeader").forEach(h => {
      h.addEventListener("click", (e) => {
        if (e.target.closest(".dragHandle")) return;
        const card = h.closest(".listCard");
        if (!card) return;
        const k = card.dataset.list;
        state.checklistsCollapsed = state.checklistsCollapsed || {};
        const wasCollapsed = state.checklistsCollapsed[k] !== false;
        state.checklistsCollapsed[k] = !wasCollapsed;
        save();
        // Toggle in-place to keep scroll position + skip full re-render churn.
        card.querySelector(".listBody").classList.toggle("hidden", !wasCollapsed);
        card.querySelector(".chev").classList.toggle("open", wasCollapsed);
      });
    });

    // Drag-to-reorder via SortableJS. Handle-only so clicks on header still collapse.
    const container = document.getElementById("checklistsContainer");
    if (container && typeof Sortable !== "undefined") {
      Sortable.create(container, {
        handle: ".dragHandle",
        animation: 180,
        delay: 0,
        delayOnTouchOnly: false,
        ghostClass: "opacity-40",
        chosenClass: "ring-2",
        onEnd: () => {
          const newOrder = Array.from(container.querySelectorAll(".listCard")).map(c => c.dataset.list);
          state.checklistsOrder = newOrder;
          save();
        },
      });
    }
  }
  if (notesSub === "expenses") {
    document.querySelectorAll(".curToggle").forEach(b => {
      b.addEventListener("click", () => {
        state.displayCurrency = b.dataset.cur === "CAD" ? "CAD" : "USD";
        save();
        renderNotes();
      });
    });
    document.getElementById("exAdd").addEventListener("click", () => {
      const amt = parseFloat(document.getElementById("exAmt").value);
      if (!amt || amt <= 0) return;
      const day = document.getElementById("exDay").value;
      state.expenses.push({
        id: uid(),
        amount: amt,
        currency: state.displayCurrency === "CAD" ? "CAD" : "USD",
        category: document.getElementById("exCat").value,
        note: document.getElementById("exNote").value,
        day: day ? +day : null,
        timestamp: new Date().toISOString(),
      });
      save();
      renderNotes();
    });
    document.querySelectorAll(".exDel").forEach(b => {
      b.addEventListener("click", () => {
        state.expenses = state.expenses.filter(e => e.id !== b.dataset.id);
        save();
        renderNotes();
      });
    });
    document.getElementById("exExport").addEventListener("click", () => {
      const rate = state.cadUsd || 0.73;
      const disp = state.displayCurrency === "CAD" ? "CAD" : "USD";
      const sym = curSymbol(disp);
      const other = disp === "USD" ? "CAD" : "USD";
      const otherSym = curSymbol(other);
      const totalDisp = state.expenses.reduce((s, e) => s + fxConvert(+e.amount || 0, e.currency || "USD", disp, rate), 0);
      const totalOther = fxConvert(totalDisp, disp, other, rate);
      const lines = state.expenses.map(e => {
        const cs = curSymbol(e.currency || "USD");
        return `Day ${e.day || "-"}\t${cs}${(+e.amount).toFixed(2)}\t${e.category}\t${e.note || ""}`;
      });
      const txt = `Canada trip expenses\nTotal: ${sym}${totalDisp.toFixed(2)} (≈ ${otherSym}${totalOther.toFixed(2)})\n\n${lines.join("\n")}`;
      navigator.clipboard.writeText(txt).then(() => alert("Copied to clipboard."));
    });
  }
}

function formatTs(ts) {
  if (!ts) return "";
  try {
    const d = new Date(ts);
    return d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  } catch { return ts; }
}

// In-modal multi-turn conversation. Cleared each time the modal opens — fresh chat each session,
// but every prompt is recorded in state.askHistory so the "Recent" chips persist across reloads.
let askMessages = [];
let askBusy = false;

function setClaudePillBusy(busy) {
  const icon = document.getElementById("claudePillIcon");
  const label = document.getElementById("claudePillLabel");
  if (!icon || !label) return;

function openAsk() {

function renderAskBody() {
  const body = document.getElementById("askBody");
  if (!body) return;
  if (askMessages.length === 0) {
    body.innerHTML = `
      <div class="text-sm opacity-60 text-center py-8">
        Ask anything about your trip.<br/>
        <span class="opacity-80">"kid-friendly poutine near Old Montréal?", "what to do if it rains in Québec City?", "is Montmorency Falls worth it with an 11-yo?"</span>
      </div>
    `;
    return;
  }
  body.innerHTML = askMessages.map(m => {
    if (m.role === "user") {
      return `<div class="flex justify-end"><div class="max-w-[85%] rounded-2xl bg-slate-900 text-white dark:bg-yellow-400 dark:text-slate-900 px-3 py-2 text-sm">${escapeHtml(m.content)}</div></div>`;
    }
    if (m.role === "assistant") {
      return `<div class="flex justify-start"><div class="max-w-[92%] rounded-2xl bg-stone-100 dark:bg-slate-800 px-3 py-2 text-sm whitespace-pre-wrap leading-relaxed">${renderAskMarkdown(m.content)}</div></div>`;
    }
    if (m.role === "pending") {
      return `<div class="flex justify-start"><div class="max-w-[85%] rounded-2xl bg-stone-100 dark:bg-slate-800 px-3 py-2 text-sm opacity-60"><span class="inline-block">Thinking</span><span class="askDots"></span></div></div>`;
    }
    if (m.role === "error") {
      return `<div class="flex justify-start"><div class="max-w-[92%] rounded-2xl bg-rose-100 text-rose-900 dark:bg-rose-900/40 dark:text-rose-200 px-3 py-2 text-sm">⚠ ${escapeHtml(m.content)}</div></div>`;
    }
    return "";
  }).join("");
  body.scrollTop = body.scrollHeight;
}

// Tiny Markdown: escapes HTML first, then converts **bold**, `code`, [text](url), and bullet lines.
function renderAskMarkdown(s) {
  let out = escapeHtml(s);
  out = out.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  out = out.replace(/`([^`]+)`/g, "<code class=\"px-1 rounded bg-slate-200 dark:bg-slate-700 text-[12px]\">$1</code>");
  out = out.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer" class="underline">$1</a>');
  return out;
}

function renderAskRecent() {
  const wrap = document.getElementById("askRecent");
  if (!wrap) return;
  const recent = (state.askHistory || []).slice(-5).reverse();
  if (!recent.length || askMessages.length > 0) {

  wrap.querySelectorAll(".askRecentChip").forEach(b => {

// Build a compact snapshot of the planner state for the ask endpoint to feed Claude.
// Server formats this into a cached Markdown block — so the model knows the full
// itinerary, what's already booked, what's outstanding, and the traveler's profile.
function appStateForAsk() {
  const trip = mergedTrip().map(d => ({
    day: d.day, date: d.date, weekday: d.weekday, city: d.city, sleep: d.sleep,
    am: d.am, pm: d.pm, transit: d.transit,
    destinations: (d.destinations || []).map(x => ({ name: x.name, note: x.note })),
    soloTip: d.soloTip ? { bucket: d.soloTip.bucket, title: d.soloTip.title, body: d.soloTip.body } : null,
  }));
  const bookings = (state.uploads || []).map(u => ({
    kind: u.extracted?.kind, day: u.day,
    title: u.extracted?.title, vendor: u.extracted?.vendor,
    date: u.extracted?.date, time: u.extracted?.time,
    endDate: u.extracted?.endDate, endTime: u.extracted?.endTime,
    confirmation: u.extracted?.confirmation,
    address: u.extracted?.address,
  }));
  const { hotels, trains, timed } = pretripUnbooked();
  const outstanding = {
    hotels: hotels.map(i => i.text),
    trains: trains.map(i => i.text),
    timed:  timed.map(i => i.text),
    reservations: BOOKINGS_CATALOG
      .filter(b => !state.bookingsDone[b.id])
      .map(b => `${b.title} (Day ${b.forDay}, lead ${b.leadDays}d)`),
  };
  return {
    trip, bookings, outstanding,
    profile: {
      interests: state.interestProfile,
      bookingStyle: "Hotels typically booked night-before or day-of — don't flag them as urgent.",
    },
  };
}

async function sendAsk() {
  const input = document.getElementById("askInput");
  const text = input.value.trim();
  if (!text || askBusy) return;
  if (!requireOnline()) return;
  input.value = "";
  askMessages.push({ role: "user", content: text });
  askMessages.push({ role: "pending" });
  renderAskBody();
  renderAskRecent();
  askBusy = true;
  setClaudePillBusy(true);
  const { day, mode } = findTodaysDay();
  const today = mode === "active" ? { day: day.day, city: day.city, date: day.date } : null;
  try {
    const r = await fetch("/api/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        messages: askMessages.filter(m => m.role === "user" || m.role === "assistant"),
        today,
        appState: appStateForAsk(),
      }),
    });
    const j = await r.json();
    askMessages = askMessages.filter(m => m.role !== "pending");
    if (j.ok && j.message) {
      askMessages.push({ role: "assistant", content: j.message });
      // Persist the prompt for the Recent chips (dedup-aware, bounded).
      state.askHistory = (state.askHistory || []).filter(p => p !== text);
      state.askHistory.push(text);
      if (state.askHistory.length > 20) state.askHistory = state.askHistory.slice(-20);
      save();
    } else {
      askMessages.push({ role: "error", content: j.error || "unknown error" });
    }
  } catch (e) {
    askMessages = askMessages.filter(m => m.role !== "pending");
    askMessages.push({ role: "error", content: e.message });
  } finally {
    askBusy = false;
    setClaudePillBusy(false);
    renderAskBody();
  }
}

/* ========== PLACE-NAME HIGHLIGHTER ========== */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
// Build a Google Maps search URL for a named place (optionally biased to a city).
function mapsUrl(name, city) {
  const q = encodeURIComponent(city ? `${name}, ${city}` : name);
  return `https://www.google.com/maps/search/?api=1&query=${q}`;
}

// Split prose into sentences for bullet display. Protects common abbreviations
// (St., U.S., etc.) so "St. Lawrence" doesn't break into two bullets. Uses a
// plain lookahead (no lookbehind) for broad browser support.
function splitSentences(text) {
  if (!text) return [];
  const abbr = ["St.", "Ste.", "Mt.", "Mtl.", "U.S.", "e.g.", "i.e.", "vs.", "No.", "approx."];
  let t = text;
  abbr.forEach((a, i) => { t = t.split(a).join("\u00a7A" + i + "\u00a7"); });
  t = t.replace(/([.!?])\s+(?=[A-Z0-9(“"])/g, "$1\u00a7|\u00a7");
  return t.split("\u00a7|\u00a7")
    .map(s => { abbr.forEach((a, i) => { s = s.split("\u00a7A" + i + "\u00a7").join(a); }); return s.trim(); })
    .filter(Boolean);
}

// Render am/pm/transit prose as a bulleted list (one bullet per sentence) so it's
// easier to scan. Single-sentence text stays a plain line. Place names stay linked.
function bulletize(text, day) {
  if (!text) return `<div class="text-[15px] mt-1 opacity-50">—</div>`;
  const items = splitSentences(text);
  if (items.length <= 1) return `<div class="text-[15px] mt-1">${highlightPlaces(text, day)}</div>`;
  return `<ul class="list-disc pl-5 space-y-1.5 text-[15px] mt-1 marker:text-red-400">${
    items.map(s => `<li>${highlightPlaces(s, day)}</li>`).join("")
  }</ul>`;
}

// Underline destination names + key city/hotel mentions inside prose text and turn
// each one into a Google Maps link. Also renders **bold** markdown.
function highlightPlaces(text, day) {
  if (!text) return "";
  let html = escapeHtml(text);
  const names = [];
  if (day) {
    if (Array.isArray(day.destinations)) {
      for (const d of day.destinations) {
        if (d && d.name) names.push(d.name);
      }
    }
    if (day.city) names.push(day.city);
    if (day.sleep) {
      const hotel = day.sleep.split(/[,(]/)[0].trim();
      if (hotel && hotel.length > 3) names.push(hotel);
    }
  }
  // Longest first so multi-word names match before their shorter substrings.
  const unique = [...new Set(names)].sort((a, b) => b.length - a.length);
  // Stash each anchor behind an opaque placeholder so that later regex passes
  // (for shorter names or **bold**) can't match into the inserted HTML —
  // otherwise "Berlin" would match inside a previous anchor's href URL and
  // shred the attributes into visible text.
  const anchors = [];
  for (const n of unique) {
    const re = new RegExp(`(${escapeRegex(escapeHtml(n))})`, "g");
    // For the city itself, don't append " , city" (it's already the city).
    const biasCity = (day && day.city && n !== day.city) ? day.city : "";
    const href = mapsUrl(n, biasCity);
    html = html.replace(re, (_m, label) => {
      const idx = anchors.length;
      anchors.push(`<a href="${href}" target="_blank" rel="noopener noreferrer" class="place-mention">${label}<span class="place-mark" aria-hidden="true">↗</span></a>`);
      return `\x00PM${idx}\x00`;
    });
  }
  // Render **bold** spans (data uses this for emphasis like "**Pre-book a taxi**").
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // Swap placeholders for the real anchor markup.
  html = html.replace(/\x00PM(\d+)\x00/g, (_m, i) => anchors[Number(i)]);
  return html;
}

/* ========== WEATHER ========== */
const CITY_COORDS = {
  "Montréal":     [45.5019, -73.5674],
  "Québec City":  [46.8139, -71.2080],
};
// June climate normals (°F). Shown when the trip date is outside live-forecast range.
const JUNE_CLIMATE = {
  "Montréal":     { hi: 74, lo: 57, icon: "🌤", note: "~12 wet days — pack a light rain layer" },
  "Québec City":  { hi: 71, lo: 52, icon: "🌦", note: "~13 wet days, cooler evenings" },
};
const forecastCache = new Map(); // key = `${city}|${date}`
function wmoEmoji(code) {
  if (code === 0) return "☀️";
  if (code === 1 || code === 2) return "🌤";
  if (code === 3) return "☁️";
  if (code >= 45 && code <= 48) return "🌫";
  if (code >= 51 && code <= 67) return "🌧";
  if (code >= 71 && code <= 77) return "❄️";
  if (code >= 80 && code <= 82) return "🌧";
  if (code === 85 || code === 86) return "🌨";
  if (code >= 95) return "⛈";
  return "🌤";
}
function weatherLine(day) {
  const c = JUNE_CLIMATE[day.city];
  if (!c) return "";
  // Departure day (Frankfurt phase already covers it) — same template is fine.
  return `${c.icon} ${day.city} · ${c.hi}° / ${c.lo}° (June avg · ${c.note})`;
}
function liveWeatherLine(day, w) {
  return `${wmoEmoji(w.code)} ${day.city} · ${w.hi}° / ${w.lo}° · ${w.pop}% rain <span class="opacity-60">· live</span>`;
}
async function fetchForecastFor(day) {
  const coords = CITY_COORDS[day.city];
  if (!coords) return null;
  const today = new Date(todayIso());
  const target = new Date(day.date);
  const daysOut = Math.round((target - today) / 86400000);
  if (daysOut > 15 || daysOut < -1) return null; // outside open-meteo's free 16-day window
  const key = `${day.city}|${day.date}`;
  if (forecastCache.has(key)) return forecastCache.get(key);
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${coords[0]}&longitude=${coords[1]}&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weathercode&temperature_unit=fahrenheit&timezone=America%2FToronto&start_date=${day.date}&end_date=${day.date}`;
  try {
    const r = await fetch(url);
    const j = await r.json();
    const d = j.daily;
    if (!d || !d.time?.length) return null;
    const result = {
      hi: Math.round(d.temperature_2m_max[0]),
      lo: Math.round(d.temperature_2m_min[0]),
      pop: d.precipitation_probability_max[0] ?? 0,
      code: d.weathercode[0],
    };
    forecastCache.set(key, result);
    return result;
  } catch { return null; }
}
// Upgrade any rendered weather slots with live data if dates are within range.
function upgradeWeatherSlots() {
  document.querySelectorAll("[data-weather-for]").forEach(async el => {
    const dayNum = +el.dataset.weatherFor;
    const day = TRIP.find(d => d.day === dayNum);
    if (!day) return;
    const w = await fetchForecastFor(day);
    if (!w) return;
    // Only update if the element is still in the DOM after the async wait.
    if (document.body.contains(el)) el.innerHTML = liveWeatherLine(day, w);
  });
}

function gmapsDir(origin, destination, mode) {
  return `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(origin)}&destination=${encodeURIComponent(destination)}&travelmode=${mode}`;
}
function shopFullLoopUrl(route) {
  return "https://www.google.com/maps/dir/" + route.loop.map(k => encodeURIComponent(route.stops[k])).join("/");
}
function shopRouteBodyHtml(route) {

    const url = gmapsDir(route.stops[L.a], route.stops[L.b], L.mode);
    return `

        <div class="flex items-center justify-between gap-2">
          <div class="font-medium text-sm">${i + 1}. ${L.icon} ${L.from} → ${L.to}</div>
          <span class="text-xs opacity-60 whitespace-nowrap">${L.t}</span>
        </div>
        <div class="text-sm opacity-75 mt-1">${L.how}</div>
        <a href="${url}" target="_blank" rel="noopener noreferrer" class="inline-block mt-2 pill bg-white border border-slate-300 dark:bg-slate-900 dark:border-slate-700 text-xs">🗺 Open this leg in Maps ↗</a>
      </div>`;
  }).join("");

    <div class="space-y-2">${legs}</div>
  `;
}

function renderReplan() {
  if (!replan) return;
  document.getElementById("replanTitle").textContent = `Change Plan — Day ${replan.fromDayNumber}`;
  const body = document.getElementById("replanBody");
  const footer = document.getElementById("replanFooter");

  // Conversation bubbles. Skip the very first seeded user message (it's just a kickoff).
  const visibleMsgs = replan.messages.slice(1);
  const bubbles = visibleMsgs.map(m => {
    if (m.role === "user") {
      return `<div class="flex justify-end"><div class="max-w-[85%] rounded-2xl bg-slate-900 text-white dark:bg-yellow-400 dark:text-slate-900 px-3 py-2 text-sm">${escapeHtml(m.content)}</div></div>`;
    }
    return `<div class="flex justify-start"><div class="max-w-[85%] rounded-2xl bg-stone-100 dark:bg-slate-800 px-3 py-2 text-sm whitespace-pre-wrap">${escapeHtml(m.content)}</div></div>`;
  }).join("");

  let statusLine = "";
  if (replan.status === "loading") statusLine = `<div class="text-xs opacity-60 text-center">Thinking…</div>`;
  if (replan.status === "error")   statusLine = `<div class="text-xs text-rose-600 text-center">Error: ${escapeHtml(replan.error || "unknown")}</div>`;

  // Opener / context note shown at top of the conversation.
  const opener = `<div class="text-xs opacity-60 rounded-xl bg-stone-50 dark:bg-slate-800/50 p-3 mb-2">
    Trip stays Jun 20–25 (6 days) — I can swap places, retitle days, or rewrite prose, but I can't add or remove days. Day 6 (Québec City → home) is fixed.
  </div>`;

  body.innerHTML = opener + bubbles + statusLine;
  body.scrollTop = body.scrollHeight;

  if (replan.status === "preview" && replan.plan) {
    footer.innerHTML = renderReplanPreview(replan.plan);
    document.getElementById("replanApplyBtn").addEventListener("click", applyReplan);
    document.getElementById("replanCancelBtn").addEventListener("click", closeReplanModal);
  } else if (replan.status === "loading") {
    footer.innerHTML = `<div class="text-center text-xs opacity-50">Waiting for Claude…</div>`;
  } else {
    footer.innerHTML = `
      <div class="flex gap-2">
        <input id="replanInput" class="flex-1 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 p-2 text-sm" placeholder="Your answer…" />
        <button id="replanSendBtn" class="pill bg-slate-900 text-white dark:bg-yellow-400 dark:text-slate-900">Send</button>
      </div>
    `;
    const input = document.getElementById("replanInput");
    const send = document.getElementById("replanSendBtn");
    input.focus();
    input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send.click(); } });
    send.addEventListener("click", () => {
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      sendReplanMessage(text);
    });
  }
}

function renderReplanPreview(plan) {
  const view = mergedTrip();
  const truncate = (s, n) => !s ? "" : (s.length > n ? s.slice(0, n - 1).trim() + "…" : s);
  const cityDiffs = plan.days.map(d => {
    const cur = view.find(x => x.day === d.day);
    const oldLabel = cur ? `${cur.city} · ${cur.title}` : "—";
    const newLabel = `${d.city} · ${d.title}`;
    const proseSnippet = truncate(`${d.am || ""} · ${d.pm || ""}`.replace(/\s+/g, " ").trim(), 180);
    const destCount = Array.isArray(d.destinations) ? d.destinations.length : 0;
    return `
      <div class="rounded-xl bg-stone-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 p-3">
        <div class="text-xs uppercase tracking-wider opacity-70 mb-1">Day ${d.day}</div>
        <div class="text-sm opacity-50 line-through">${escapeHtml(oldLabel)}</div>
        <div class="text-sm font-medium mt-1">→ ${escapeHtml(newLabel)}</div>
        ${proseSnippet ? `<div class="text-xs opacity-75 mt-2 leading-relaxed">${escapeHtml(proseSnippet)}</div>` : ""}
        <div class="text-xs opacity-60 mt-1">${destCount} destination${destCount === 1 ? "" : "s"}${d.sleep ? ` · 🛏 ${escapeHtml(d.sleep)}` : ""}</div>
      </div>
    `;
  }).join("");
  return `
    <div class="rounded-2xl bg-amber-50 dark:bg-amber-900/30 border border-amber-300 dark:border-amber-700 p-3 mb-3 text-sm">
      <div class="font-medium mb-1">📋 ${escapeHtml(plan.summary || "Plan ready to review")}</div>
      ${plan.cascade_explanation ? `<div class="text-xs opacity-80 mt-1">${escapeHtml(plan.cascade_explanation)}</div>` : ""}
    </div>
    <div class="space-y-2 mb-3 max-h-48 overflow-y-auto">${cityDiffs}</div>
    <div class="flex gap-2">
      <button id="replanApplyBtn" class="pill bg-slate-900 text-white dark:bg-yellow-400 dark:text-slate-900 flex-1">Apply ${plan.days.length} day${plan.days.length === 1 ? "" : "s"}</button>
      <button id="replanCancelBtn" class="pill bg-white border border-slate-300 dark:bg-slate-800 dark:border-slate-700">Cancel</button>
    </div>
  `;
}

async function sendReplanMessage(text) {
  if (!replan) return;
  if (text) replan.messages.push({ role: "user", content: text });
  if (!requireOnline()) {
    replan.status = "error";
    replan.error = "You're offline. Connect, then try again.";
    renderReplan();
    return;
  }
  replan.status = "loading";
  replan.error = null;
  renderReplan();
  try {
    const r = await fetch("/api/replan", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        messages: replan.messages,
        fromDayNumber: replan.fromDayNumber,
        trip: mergedTrip(),
      }),
    });
    const j = await r.json();
    if (!j.ok) {
      replan.status = "error";
      replan.error = j.error || "unknown error";
      renderReplan();
      return;
    }
    if (j.complete && j.plan) {
      replan.plan = j.plan;
      replan.status = "preview";
    } else {
      replan.messages.push({ role: "assistant", content: j.message });
      replan.status = "typing";
    }
    renderReplan();
  } catch (e) {
    replan.status = "error";
    replan.error = e.message;
    renderReplan();
  }
}

function applyReplan() {
  if (!replan || !replan.plan) return;
  state.dayOverrides = state.dayOverrides || {};
  for (const d of replan.plan.days) {
    if (!d || typeof d.day !== "number") continue;
    state.dayOverrides[d.day] = { ...d };
  }
  save();
  closeReplanModal();
  renderDays();
}

/* ========== HEADER CLOCKS ========== */
// Berlin 24h (trip local), NY + LA 12h with compact a/p suffix.
function fmtTime(tz, mode) {
  const d = new Date();
  if (mode === "24") {
    return d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", timeZone: tz });
  }
  return d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", timeZone: tz })
    .replace(/\s?AM$/i, "a").replace(/\s?PM$/i, "p");
}
function renderClocks() {
  const el = document.getElementById("clocks");
  if (!el) return;
  el.textContent = `🍁 ${fmtTime("America/Toronto", "12")} · 🗽 ${fmtTime("America/New_York", "12")} · 🌴 ${fmtTime("America/Los_Angeles", "12")}`;
}
renderClocks();
// Tick at the top of every minute so the display stays accurate without sub-minute churn.
setInterval(renderClocks, 15000);

/* ========== FONT SIZE SLIDER ========== */
// Scales the document by changing html font-size (Tailwind rem-based classes
// follow automatically) and body's pixel default. State persists across loads.
function applyFontScale() {
  const s = (typeof state.fontScale === "number" && state.fontScale > 0) ? state.fontScale : 1;
  document.documentElement.style.fontSize = (16 * s) + "px";
  document.body.style.setProperty("font-size", (14 * s) + "px", "important");
}
const fontScaleInput = document.getElementById("fontScale");
if (fontScaleInput) {
  fontScaleInput.value = state.fontScale || 1;
  fontScaleInput.addEventListener("input", (e) => {
    state.fontScale = parseFloat(e.target.value) || 1;
    applyFontScale();
    save();
  });
}
applyFontScale();
